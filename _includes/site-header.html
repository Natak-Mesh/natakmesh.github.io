<header class="site-header">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/brand/natakmesh-wordmark-orange.png' | relative_url }}" alt="Natak Mesh" width="743" height="349"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation.primary %}
        <li><a href="{{ item.url | relative_url }}"{% if page.nav == item.id %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
        <li><a class="btn btn-buy" href="{{ site.shop_url }}" rel="noopener">Buy</a></li>
      </ul>
    </nav>
  </div>
</header>
